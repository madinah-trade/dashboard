<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>لوحة متابعة إدارة العروض والشراكات — دخول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--green:#0B3D2E;--green2:#145843;--gold:#C9A227;--ink:#12211C;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',system-ui,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(160deg,#0B3D2E 0%,#145843 55%,#1d6b52 100%);position:relative;overflow:hidden}
  body::after{content:'';position:absolute;inset:0;
       background:radial-gradient(ellipse 60% 45% at 50% 110%,rgba(201,162,39,.22),transparent 70%)}
  .card{position:relative;z-index:2;background:#fff;border-radius:20px;padding:44px 40px 36px;
        width:min(420px,92vw);box-shadow:0 25px 70px rgba(0,0,0,.35);text-align:center}
  .crest{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(145deg,var(--green),var(--green2));color:#fff;font-size:28px}
  h1{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .sub{font-size:13.5px;color:#5c6f66;margin-bottom:26px}
  .field{text-align:right;margin-bottom:14px}
  label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px}
  input{width:100%;padding:12px 14px;border:1.5px solid #d6ded9;border-radius:10px;font-size:15px;
        background:#fafcfb;transition:.2s;text-align:right}
  input:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(20,88,67,.12)}
  button{width:100%;margin-top:8px;padding:13px;border:none;border-radius:10px;cursor:pointer;
         background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;font-size:16px;font-weight:800;
         transition:.2s}
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.6;cursor:wait}
  .err{display:none;margin-top:14px;background:#FDECEA;color:#B3261E;border-radius:9px;
       padding:10px 12px;font-size:13.5px;font-weight:500}
  .foot{margin-top:22px;font-size:11.5px;color:#8aa094}
  .shake{animation:sh .4s}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="crest">🕌</div>
    <h1>لوحة متابعة إدارة العروض والشراكات</h1>
    <div class="sub">مكتب تنمية الوجهة — منطقة المدينة المنورة<br>محتوى خاص بالزملاء والشركاء</div>
    <div class="field"><label>اسم المستخدم</label><input id="u" autocomplete="username" required></div>
    <div class="field"><label>الرقم السري</label><input id="p" type="password" autocomplete="current-password" required></div>
    <button id="b" type="submit">دخول</button>
    <div class="err" id="e">بيانات الدخول غير صحيحة — حاول مرة أخرى.</div>
    <div class="foot">© 2026 هيئة تطوير منطقة المدينة المنورة</div>
  </form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('b'),err=document.getElementById('e'),card=document.getElementById('f');
  btn.disabled=true;btn.textContent='جارٍ التحقق…';err.style.display='none';
  try{
    const raw=b64(BLOB),salt=raw.slice(0,16),iv=raw.slice(16,28),ct=raw.slice(28);
    const secret=new TextEncoder().encode(
      document.getElementById('u').value.trim().toLowerCase()+':'+document.getElementById('p').value);
    const km=await crypto.subtle.importKey('raw',secret,'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(x){
    err.style.display='block';card.classList.add('shake');
    setTimeout(()=>card.classList.remove('shake'),450);
    btn.disabled=false;btn.textContent='دخول';
  }
});
